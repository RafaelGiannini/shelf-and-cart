<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shelf &amp; Cart</title>
<meta name="theme-color" content="#1E6A48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shelf & Cart">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#F1F5F1; --surface:#FFFFFF; --sunk:#E6ECE7; --ink:#14251D; --muted:#5B6C63; --line:#D7E0DA;
  --green:#1E6A48; --green-ink:#FFFFFF; --sticker:#F2B705; --sticker-ink:#2B2100;
  --fridge:#2B7BAE; --fridge-bg:#E3EFF7; --freezer:#6A5CC2; --freezer-bg:#ECE9FA; --pantry:#A87822; --pantry-bg:#F6EEDC;
  --bathroom:#1A8781; --bathroom-bg:#DFF2F0; --laundry:#B0457A; --laundry-bg:#F8E5EF; --cleaning:#5A8420; --cleaning-bg:#EAF2DC;
  --danger:#BF3F2B; --shadow:0 1px 2px rgba(20,37,29,.06),0 6px 18px rgba(20,37,29,.07);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201B; --sunk:#111915; --ink:#E4EDE8; --muted:#92A399; --line:#25322C;
  --green:#4DB283; --green-ink:#06170F; --sticker:#F5C22F; --sticker-ink:#231A00;
  --fridge:#6CB3E2; --fridge-bg:#13242F; --freezer:#A598F0; --freezer-bg:#1D1A30; --pantry:#DCAA55; --pantry-bg:#2A2214;
  --bathroom:#5CCFC6; --bathroom-bg:#11282A; --laundry:#EE8DBB; --laundry-bg:#2B1722; --cleaning:#A8D360; --cleaning-bg:#1C2613;
  --danger:#EF7A62; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --sunk:#111915; --ink:#E4EDE8; --muted:#92A399; --line:#25322C;
  --green:#4DB283; --green-ink:#06170F; --sticker:#F5C22F; --sticker-ink:#231A00;
  --fridge:#6CB3E2; --fridge-bg:#13242F; --freezer:#A598F0; --freezer-bg:#1D1A30; --pantry:#DCAA55; --pantry-bg:#2A2214;
  --bathroom:#5CCFC6; --bathroom-bg:#11282A; --laundry:#EE8DBB; --laundry-bg:#2B1722; --cleaning:#A8D360; --cleaning-bg:#1C2613;
  --danger:#EF7A62; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 10px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--sticker);color:var(--sticker-ink);display:grid;place-items:center;flex:none;transform:rotate(-4deg)}
h1{font:750 22px/1 var(--f-display);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.menubtn{margin-left:auto;position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;padding:0}
.menubtn i{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:#d99a1e;border:2px solid var(--surface)}
.menubtn.on i{background:var(--green)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sync{margin-left:auto;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;background:none;border:0;padding:6px 0}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--green)}
.banner{padding:10px 12px;border-radius:10px;background:var(--sunk);color:var(--muted);font-size:13px}

main .wrap{padding-block:14px 130px;display:flex;flex-direction:column;gap:16px}
h2{font:700 13px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}

.addrow{display:flex;gap:8px}
.field{flex:1;min-width:0;width:100%;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;outline:none;font-size:16px}
.field:focus{border-color:var(--green)}
.lbl>.field,.lbl>select.field,.lbl .datefield .field{flex:none}
select.field{padding-right:8px}
.btn{height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--green);color:var(--green-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.small{height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:20px;height:20px;flex:none}

.group{display:flex;flex-direction:column;gap:6px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:56px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;display:grid;place-items:center;color:transparent;padding:0}
.row.done .check{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.row.done .name{text-decoration:line-through;color:var(--muted)}
.meta{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.note{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:1px}
.code{font:500 11.5px var(--f-mono);letter-spacing:.04em}
.qtytag{font:600 13px var(--f-body);font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.have{color:var(--green);font-weight:600}
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none;background:var(--sunk);border:1px solid var(--line)}
.listfoot{display:flex;flex-wrap:wrap;gap:8px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px;font-size:14px}
.empty b{display:block;color:var(--ink);font:700 16px var(--f-display);margin-bottom:4px}

.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fridge{--zc:var(--fridge);--zb:var(--fridge-bg)}
.freezer{--zc:var(--freezer);--zb:var(--freezer-bg)}
.pantry{--zc:var(--pantry);--zb:var(--pantry-bg)}
.bathroom{--zc:var(--bathroom);--zb:var(--bathroom-bg)}
.laundry{--zc:var(--laundry);--zb:var(--laundry-bg)}
.cleaning{--zc:var(--cleaning);--zb:var(--cleaning-bg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--zc,var(--muted))}
.zone{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.zonehead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--zb)}
.zonehead h3{margin:0;font:750 18px/1 var(--f-display);color:var(--zc)}
.zgroup{display:flex;flex-direction:column;gap:14px}
.zones{display:flex;flex-direction:column;gap:14px}
.zgroup>h2{margin-top:4px}
.zonehead .count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.zonehead .btn{margin-left:auto}
.helpwrap{display:flex;flex-direction:column;gap:6px}
details.help{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.help summary{cursor:pointer;font-weight:700}
details.help p,details.help ul{margin:8px 0 2px;font-size:14px;line-height:1.5;color:var(--ink)}
details.help ul{padding-left:20px;display:flex;flex-direction:column;gap:5px}
.today{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.today .head{display:flex;align-items:center;justify-content:space-between}
.today h3{margin:0;font:750 17px var(--f-display)}
.todo{display:flex;align-items:center;gap:10px;padding:8px 4px;border:0;background:transparent;color:var(--ink);text-align:left;font:inherit;font-size:14px;border-top:1px solid var(--line);width:100%}
.todo>span:nth-child(2){flex:1;min-width:0}
.todo .when{color:var(--muted);font-size:12.5px}
.todo .dot{flex:none}
.dot.red{background:var(--danger)} .dot.amber{background:#d99a1e} .dot.green{background:var(--green)}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:110px}
.mbar{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;font-size:12px;color:var(--muted);font-weight:600;padding:0}
.mbar .col{flex:1;width:100%;max-width:38px;display:flex;align-items:flex-end;background:var(--sunk);border-radius:8px;overflow:hidden}
.mbar .col i{display:block;width:100%;background:var(--muted);border-radius:8px 8px 0 0}
.mbar.on{color:var(--ink)} .mbar.on .col i{background:var(--green)}
.sbars{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.sbar{display:grid;grid-template-columns:minmax(70px,30%) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.sbar .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar .track{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.sbar .track i{display:block;height:100%;background:var(--green);border-radius:6px}
.sbar .v{font-variant-numeric:tabular-nums;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:0 0 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;text-align:left;color:var(--ink);font:inherit}
.tile img,.tile .ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--sunk)}
.tile .ph{display:grid;place-items:center;font:750 30px var(--f-display);color:var(--muted)}
.tile .tn{font-weight:700;font-size:13px;padding:4px 8px 0;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .tb{font-size:11.5px;color:var(--muted);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tq{position:absolute;top:6px;right:6px;background:var(--ink);color:var(--bg);font-weight:750;font-size:12px;border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.tile .tbadge{position:absolute;top:6px;left:6px;font-size:11px;background:var(--surface);border-radius:999px;padding:2px 7px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tile .tl{margin:4px 8px 0}
.tile.lowt{border-color:var(--danger)}
.fvopen{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:0;border-radius:16px;background:linear-gradient(135deg,#123a2b,#1d5b74);color:#fff;text-align:left;font:inherit;box-shadow:var(--shadow)}
.fvopen>span:nth-child(2){flex:1;display:flex;flex-direction:column;gap:2px}
.fvopen b{font:750 17px var(--f-display)} .fvopen small{opacity:.8;font-size:12.5px}
.fvopen-art{display:grid;grid-template-columns:repeat(3,14px);gap:4px;padding:6px;border-radius:10px;background:rgba(255,255,255,.12)}
.fvopen-art i{height:22px;border-radius:4px;background:rgba(255,255,255,.75)} .fvopen-art i:nth-child(2){background:#F2B705} .fvopen-art i:nth-child(3){background:#7fd1ae}
/* fridge view: always a dark glass display */
.fv{position:fixed;inset:0;z-index:36;display:flex;flex-direction:column;color:#eef4f1;background:radial-gradient(120% 80% at 50% -10%,#1d3a46 0%,#0f1d22 45%,#0a1215 100%);
  --fridge:#6CB3E2;--freezer:#A598F0;--pantry:#DCAA55;--bathroom:#5fc4c0;--laundry:#e48bb6;--cleaning:#9ccc65;--tile:150px;--line:rgba(255,255,255,.1);--ink:#eef4f1;--muted:#9fb3ab;--surface:#16252b;--sunk:#0f1b20}
.fv[data-size="s"]{--tile:116px} .fv[data-size="l"]{--tile:200px}
.fv-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:calc(12px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px))}
.fv-clock{display:flex;flex-direction:column;line-height:1.05}
.fv-clock b{font:750 30px var(--f-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums} .fv-clock span{font-size:12.5px;color:var(--muted)}
.fv-stats{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.fv-stats span{padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.06)} .fv-stats b{color:var(--ink)} .fv-stats .warn{background:rgba(242,183,5,.16);color:#ffd45c}
.fv-acts{margin-left:auto;display:flex;align-items:center;gap:8px}
.fv-search{display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--muted)}
.fv-search input{background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:15px;width:130px}
.fv-size{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:3px;border:1px solid var(--line)}
.fv-size button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-weight:750}
.fv-size button[aria-pressed="true"]{background:#eef4f1;color:#0f1d22}
.fv-icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);display:grid;place-items:center}
.fv-icon.on{background:#F2B705;color:#2B2100;border-color:transparent}
.fv-zones{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:6px max(18px,env(safe-area-inset-left,0px)) 10px;flex:none}
.fv-zone{flex:none;min-width:118px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 16px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);text-align:left;position:relative;overflow:hidden;transition:background .15s,transform .15s}
.fv-zone::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--zc,#eef4f1)}
.fv-zone .fv-zn{font:750 17px var(--f-display)} .fv-zone .fv-zc{font-size:12.5px;color:var(--muted)} .fv-zone em{font-style:normal;color:#ffd45c;font-weight:700}
.fv-zone[aria-pressed="true"]{background:color-mix(in srgb,var(--zc,#eef4f1) 22%,transparent);border-color:color-mix(in srgb,var(--zc,#eef4f1) 60%,transparent)}
.fv-filters{display:flex;gap:8px;padding:0 max(18px,env(safe-area-inset-left,0px)) 6px;flex:none;overflow-x:auto;scrollbar-width:none}
.fv-filters button{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:650;font-size:13.5px}
.fv-filters button span{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.fv-filters button[aria-pressed="true"]{background:#eef4f1;color:#0f1d22;border-color:transparent}
.fv-filters .soon[aria-pressed="true"]{background:#F2B705;color:#2B2100} .fv-filters .low[aria-pressed="true"]{background:#EF7A62;color:#2a0d07}
.fv-body{flex:1;overflow:auto;padding:6px 0 calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.fv-shelf h3{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;padding:0 max(18px,env(safe-area-inset-left,0px));font:700 13px var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.fv-shelf h3 small{font-size:12px;opacity:.7}
.fv-shelf.fridge h3 span,.fv-shelf.freezer h3 span,.fv-shelf.pantry h3 span,.fv-shelf.bathroom h3 span,.fv-shelf.laundry h3 span,.fv-shelf.cleaning h3 span{color:var(--zc)}
.fv-row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:18px;padding:4px max(18px,env(safe-area-inset-left,0px)) 14px;scrollbar-width:none}
.fv-row::-webkit-scrollbar{display:none}
.fv-glass{height:10px;margin:-8px max(10px,env(safe-area-inset-left,0px)) 0;border-radius:3px;background:linear-gradient(180deg,rgba(190,225,240,.28),rgba(190,225,240,.06) 60%,transparent);box-shadow:0 -1px 0 rgba(220,240,250,.35) inset}
.fv-tile{flex:none;width:var(--tile);scroll-snap-align:start;position:relative;display:flex;flex-direction:column;gap:7px;border:0;padding:0;background:transparent;color:var(--ink);text-align:left;font:inherit;transition:transform .15s}
.fv-tile:active{transform:scale(.97)}
.fv-img{display:block;width:100%;aspect-ratio:1;border-radius:20px;overflow:hidden;background:#1b2c33;box-shadow:0 10px 24px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06) inset}
.fv-img img{width:100%;height:100%;object-fit:cover;display:block}
.fv-ph{width:100%;height:100%;display:grid;place-items:center;font-size:calc(var(--tile) * .38);background:linear-gradient(145deg,#25404a,#162a31)}
.fv-ph[data-cat="Produce"]{background:linear-gradient(145deg,#2f5a3a,#18301f)} .fv-ph[data-cat="Dairy & Eggs"]{background:linear-gradient(145deg,#3c4f63,#1e2a36)}
.fv-ph[data-cat="Meat & Seafood"]{background:linear-gradient(145deg,#5e3434,#2e1919)} .fv-ph[data-cat="Spices & Seasonings"],.fv-ph[data-cat="Bakery"],.fv-ph[data-cat="Pantry"]{background:linear-gradient(145deg,#5a4524,#2c2112)}
.fv-ph[data-cat="Frozen"]{background:linear-gradient(145deg,#3a3a6a,#1c1c36)} .fv-ph[data-cat="Drinks"],.fv-ph[data-cat="Snacks"]{background:linear-gradient(145deg,#4d3a5c,#25192e)}
.fv-tile.fv-soon .fv-img{box-shadow:0 10px 24px rgba(0,0,0,.35),0 0 0 3px #F2B705} .fv-tile.fv-bad .fv-img{box-shadow:0 10px 24px rgba(0,0,0,.35),0 0 0 3px #EF7A62}
.fv-chip{position:absolute;top:8px;left:8px;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:750;background:#F2B705;color:#2B2100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.fv-tile.fv-bad .fv-chip{background:#EF7A62;color:#2a0d07}
.fv-qty{position:absolute;top:8px;right:8px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:750;background:rgba(10,18,21,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-variant-numeric:tabular-nums}
.fv-tile.fv-low .fv-qty{background:#EF7A62;color:#2a0d07}
.fv-level{position:absolute;left:10px;right:10px;top:calc(var(--tile) - 18px);height:6px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden}
.fv-level i{display:block;height:100%;background:#7fd1ae}
.fv-tile.fv-low .fv-level i{background:#EF7A62}

<div id="gate" class="wrap gate" hidden></div>

<div id="app" hidden>
<header>
  <div class="wrap">
    <div class="logo" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h2l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg></div>

    </button>
    <button class="tab" data-tab="recipes">

// this device's look: theme (auto/light/dark) and layout (auto/phone/desktop)
(function () {
  const get = k => { try { return localStorage.getItem(k) || 'auto'; } catch (e) { return 'auto'; } };
  const apply = () => {
    const t = get('ui:theme'), l = get('ui:layout'), root = document.documentElement, z = get('ui:text'), simple = get('ui:simple');
    if (z === 'auto') root.removeAttribute('data-text'); else root.setAttribute('data-text', z);
    if (simple === 'on') root.setAttribute('data-simple', ''); else root.removeAttribute('data-simple');
    if (t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
    const wide = l === 'desktop' || (l === 'auto' && matchMedia('(min-width: 900px)').matches);
    root.setAttribute('data-layout', wide ? 'desktop' : 'phone');
    const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#0E1512' : '#F1F5F1');
  };
  window.__applyUI = apply; apply();
  matchMedia('(min-width: 900px)').addEventListener?.('change', apply);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', apply);
})();
// offline startup: keep a copy of the app on this phone
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>

/* deleting moves a household to the trash; the admin can restore it for 30 days */
async function trashHousehold(h) {
  if (h.inviteCode) await deleteDoc(doc(fs, 'invites', h.inviteCode)).catch(() => {});
  await updateDoc(doc(fs, 'households', h.id), {deletedAt: Date.now(), deletedBy: S.uid, deletedMembers: h.members || [], members: [], inviteCode: deleteField()});

async function restoreHousehold(h) {

async function purgeHousehold(h) {
  if (h.inviteCode) await deleteDoc(doc(fs, 'invites', h.inviteCode)).catch(() => {});
  for (const coll of ['list', 'kitchen', 'hprods', 'receipts', 'recipes', 'rphotos', 'activity', 'plan', 'waste']) {
    const snap = await getDocs(collection(fs, 'households', h.id, coll)).catch(() => null);
    if (!snap) continue;
    for (let i = 0; i < snap.docs.length; i += 400) { const b = writeBatch(fs); snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit().catch(() => {}); }
  }

}
async function leaveHousehold(h) {
  const hdoc = doc(fs, 'households', h.id);
  const members = h.members || [];
  if (h.owner === S.uid && members.length === 1) { await trashHousehold(h); return; }
  if (h.owner === S.uid) {
    const heir = members.find(m => m !== S.uid);
    await updateDoc(hdoc, {owner: heir, members: arrayRemove(S.uid), [`memberInfo.${S.uid}`]: deleteField()});
  } else await updateDoc(hdoc, {members: arrayRemove(S.uid), [`memberInfo.${S.uid}`]: deleteField()});
}

async function adminHousekeeping() {

    const all = await getDocs(collection(fs, 'households'));
    for (const d of all.docs) {
      const h = d.data();
      // locations from firebase-config.js for households that have none yet
      if (!h.deletedAt && !(h.places || []).length) {
        const norm = n => lc(n).replace(/\s+and\s+/g, ' & ').replace(/\s+/g, ' ').trim();
        const g = FAMILY.find(f => Array.isArray(f.places) && f.places.length && norm(f.name) === norm(h.name || ''));
        if (g) await updateDoc(d.ref, {places: g.places.map(n => ({id: slug(n), name: n}))}).catch(() => {});
      }
      // empty the trash after 30 days

    }
  } catch (e) {}
}

/* ---- storage: the free Firebase plan holds 1 GiB. Everything is measured by reading it, so it runs only when asked. ---- */
const ST_COLLS = [['rphotos', 'Receipt photos'], ['receipts', 'Receipts'], ['hprods', 'Product notes and prices'], ['kitchen', 'In stock'], ['recipes', 'Recipes'], ['list', 'List'], ['activity', 'Activity'], ['plan', 'Meal plan'], ['waste', 'Waste log']];
const ST_LIMIT = 1024 ** 3;
const docBytes = (id, d) => { try { return id.length + JSON.stringify(d).length + 40; } catch (e) { return 0; } };
const fmtBytes = b => b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';
const OLD_PHOTO_DAYS = 90, SMALL_PHOTO = 150000;
async function storageScan(progress) {
  const out = {at: Date.now(), hs: [], total: 0, oldBig: [], orphans: []};
  const live = A.hs.filter(h => !h.deletedAt);
  for (const [hi, h] of live.entries()) {
    const row = {h, by: {}, total: 0};
    let rdates = {};
    // receipts first, so each photo can be matched to its receipt's date
    for (const [c] of [...ST_COLLS].sort((a, b) => (b[0] === 'receipts') - (a[0] === 'receipts'))) {
      progress?.(`${h.name}: ${c} (${hi + 1} of ${live.length})`);
      const snap = await getDocs(collection(fs, 'households', h.id, c));
      let b = 0;
      snap.forEach(d => { const data = d.data(); b += docBytes(d.id, data);
        if (c === 'receipts') rdates[d.id] = data.date || null;
        if (c === 'rphotos') { const len = String(data.img || '').length, rd = rdates[d.id];
          if (!(d.id in rdates)) out.orphans.push({hid: h.id, id: d.id, b: len});
          else if (len > SMALL_PHOTO && rd && daysUntil(rd) < -OLD_PHOTO_DAYS) out.oldBig.push({hid: h.id, id: d.id, b: len}); } });
      row.by[c] = {n: snap.size, b}; row.total += b;

}

/* a scanned product against the list: the same barcode or name, the same type, or a generic word on the list

const KFAMILY = [[/cheddar|mozzarella|parmesan|swiss|provolone|monterey jack|pepper jack|colby|feta|gouda|brie|ricotta|havarti|muenster|american cheese|string cheese|queso|cheese/, 'cheese'],
  [/romaine|iceberg|spring mix|butter lettuce|lettuce/, 'lettuce'], [/gala|fuji|honeycrisp|granny smith|red delicious|pink lady|\bapples?\b/, 'apple'], [/yogh?urt/, 'yogurt'], [/chicken/, 'chicken'],
  [/ground beef|steak|sirloin|ribeye|\bbeef\b/, 'beef'], [/\bmilk\b/, 'milk'], [/bread|loaf|baguette|sourdough/, 'bread'], [/tortilla/, 'tortillas'], [/\beggs?\b/, 'eggs'], [/salsa/, 'salsa'],
  [/coffee/, 'coffee'], [/cereal|granola/, 'cereal'], [/pasta|spaghetti|penne|linguine|macaroni|rigatoni/, 'pasta'], [/rice\b/, 'rice'], [/beans?\b/, 'beans'], [/juice/, 'juice'], [/water\b/, 'water'],
  [/paper towel/, 'paper towels'], [/toilet paper|bath tissue/, 'toilet paper'], [/detergent/, 'detergent'], [/banana/, 'bananas'], [/onion/, 'onions'], [/tomato/, 'tomatoes'], [/potato/, 'potatoes'], [/avocado/, 'avocados']];
const kindFamily = t => (KFAMILY.find(([re]) => re.test(lc(t || ''))) || [])[1] || null;
function listMatch(p, open = S.list.filter(x => !x.done)) {
  const pl = workPlace(), okPlace = l => !multiPlace() || !l.place || !pl || l.place === pl;
  const pool = open.filter(okPlace).length ? open.filter(okPlace) : open;
  const pt = tokens(p.name), pk = typeOf(p).kind, fam = kindFamily(p.name + ' ' + pk);
  const sing = w => w.replace(/(ies)$/, 'y').replace(/s$/, '');
  return (p.code && pool.find(x => x.code === p.code)) || pool.find(x => lc(x.name) === lc(p.name))
    || pool.find(x => !x.code && tokens(x.name).length && tokens(x.name).every(w => pt.some(n => sing(n).startsWith(sing(w)) || sing(w).startsWith(sing(n)))))
    || pool.find(x => !x.code && sameType(x, p))
    || (fam ? pool.find(x => !x.code && tokens(x.name).length <= 3 && kindFamily(x.name) === fam) : null) || null;
}
async function runMode(p) {
  let recs, tag, detail, expNow = null;
  if (S.mode === 'stock' && !('bought' in p)) p = {...p, bought: S.fresh === 'old' ? null : todayYmd()};
  if (S.mode === 'stock') {
    const wp = workPlace();
    const before = kFind(p, S.scanLoc, wp);
    expNow = minDate(before?.exp, p.exp);
    recs = await addToKitchen(p, S.scanLoc, p.qty || 1, wp);
    if (recs.next) expNow = recs.next.exp || null;
    const nx = recs.next || {qty: (before?.qty || 0) + (p.qty || 1)};
    tag = 'Added'; detail = `${multiPlace() ? placeName(wp) + ' · ' : ''}${zName(S.scanLoc)} · ${nx.track === 'count' ? packText(nx) : 'now ' + nx.qty}`;
    const onList = p.bought ? listMatch(p) : null;
    if (onList) { recs = [...recs, {coll: 'list', id: onList.id, prev: strip(onList)}]; del('list', onList.id).catch(() => {}); detail += ` · checked “${onList.name}” off the list`; }
  } else if (S.mode === 'cart') {
    const open = S.list.filter(x => !x.done), l = listMatch(p, open);
    if (l) {
      recs = [{coll: 'list', id: l.id, prev: strip(l)}];
      // "cheese" on the list, Great Value Cheddar in the cart: the list item becomes what you actually bought
      const real = !l.code && p.name && lc(p.name) !== lc(l.name);
      put('list', l.id, {...strip(l), done: true, ...(real ? {name: p.name, wanted: l.wanted || l.name, category: p.category || l.category} : {}), code: l.code || p.code || null, thumb: l.thumb || p.thumb || null, image: p.image || l.image || null}).catch(() => {});
      tag = 'In the cart'; detail = `Checked off \u201c${l.name}\u201d${real ? ` → ${p.name}` : ''} \u00b7 ${Math.max(0, open.length - 1)} left`;
    } else {
      const id = uid();
      recs = [{coll: 'list', id, prev: null}];
      put('list', id, {name: p.name, code: p.code || null, category: p.category || guessCat(p.name), qty: 1, done: true, thumb: null, store: activeStore() || prodOf(p)?.store || '', by: S.uid, at: Date.now()}).catch(() => {});
      tag = 'Added to cart'; detail = 'Wasn\u2019t on the list';
    }
  } else if (S.mode === 'list') {
    recs = await addToList(p, p.qty || 1);
    tag = 'On the list'; detail = haveCount(p) ? `You have ${haveCount(p)} at home` : 'None at home';
  } else {
    const r = await useOne(p); recs = r.recs; tag = 'Used up';
    detail = r.hit ? `Took one from ${zName(r.hit.location)} · added to list` : `Not in stock${multiPlace() && workPlace() ? ' in ' + placeName(workPlace()) : ''} · added to list`;
  }
  const img = p.thumb || p.image || (p.code && S.products[p.code]?.image) || null;
  S.last = {name: p.name, code: p.code, tag, detail, recs, img, expId: S.mode === 'stock' ? recs[0].id : null, exp: expNow, bought: S.mode === 'stock' ? (p.bought || null) : undefined};
  S.recent.unshift({name: p.name, what: `${tag} · ${detail}`, img});
  logAct(S.mode === 'stock' ? `stocked ${p.name}` : S.mode === 'list' ? `added ${p.name} to the list` : S.mode === 'cart' ? `put ${p.name} in the cart` : `used ${p.name}`);
  return S.last;
}

async function resolveCode(raw, onStatus) {
  const code = normCode(raw) || String(raw).trim();
  if (!code) return {kind: 'none'};
  const known = S.products[code];
  if (known && !known.nameOnly && known.name) return {kind: 'known', p: {code, name: known.name, category: known.category, image: known.image || known.thumb || null}};
  onStatus && onStatus(code);
  try {
    const g = await getDoc(doc(fs, 'products', code));
    if (g.exists() && g.data().name) {
      const d = g.data(), prod = {name: d.name, category: d.category || 'Other', location: d.location || defLoc(d.category), image: d.image || null, thumb: d.thumb || null, ...(d.brand ? {brand: d.brand} : {}), ...(d.kind ? {kind: d.kind} : {}), ...(d.nutr ? {nutr: d.nutr, ingr: d.ingr || null, allergens: d.allergens || [], ns: d.ns || null} : {}), source: 'shared', by: S.uid, at: Date.now()};
      setDoc(href('products', code), {...(known ? strip(known) : {}), ...prod}).catch(() => {});
      S.products[code] = {id: code, ...(known || {}), ...prod};
      return {kind: 'known', p: {code, name: prod.name, category: prod.category, image: prod.image || prod.thumb}};
    }
  } catch (e) {}
  const found = navigator.onLine ? await lookupOnline(code) : null;
  if (found) {
    const prod = {name: found.name, category: found.category, location: defLoc(found.category), image: found.image, source: found.source, ...(found.brand ? {brand: found.brand} : {}), nutr: found.nutr || null, ingr: found.ingr || null, allergens: found.allergens || [], ns: found.ns || null, facts: found.facts || null, by: S.uid, at: Date.now()};
    put('products', code, prod).catch(() => {});
    S.products[code] = {id: code, ...prod};
    return {kind: 'found', p: {code, name: found.name, category: found.category, image: found.image}, source: found.source};
  }
  return {kind: 'unknown', code};
}

async function saveForm(form, s) {
  const fd = new FormData(form);
  const name = String(fd.get('name') || '').trim();
  if (!name) { form.querySelector('[name=name]').focus(); return null; }
  const category = String(fd.get('cat'));
  const qty = Math.max(1, parseInt(fd.get('qty'), 10) || 1);
  const note = String(fd.get('note') || '').trim();
  const exp = String(fd.get('exp') || '') || null;
  const bought = (s.fresh || S.fresh || 'new') === 'old' ? null : todayYmd();
  const loc = s.loc || (S.mode === 'stock' ? S.scanLoc : defLoc(category));
  if (s.code) {
    const prevProd = S.products[s.code] ? strip(S.products[s.code]) : null;
    const prod = {...(prevProd || {}), name, category, location: loc, image: s.image || null, thumb: s.thumb || null, ...(s.kind ? {kind: s.kind} : {}), ...(s.brand != null ? {brand: s.brand} : {}), by: S.uid, at: Date.now()};
    put('products', s.code, prod).catch(() => {});
    S.products[s.code] = {id: s.code, ...prod};
    const keep = S.scanLoc; if (S.mode === 'stock') S.scanLoc = loc;
    if (s.track && s.track !== 'pkg') { await updateProduct({code: s.code, name, category}, {track: s.track, packSize: s.packSize || null, unit: s.unit || null}); }
    const r = await runMode({code: s.code, name, category, thumb: s.thumb, image: s.image || null, qty, exp, bought, track: s.track, packSize: s.packSize, unit: s.unit});
    if (S.mode === 'stock') S.scanLoc = keep;
    r.recs.unshift({coll: 'products', id: s.code, prev: prevProd});

  if (same) return [same.location, 'where it already is'];

  if (kin.length) { const c = {}; for (const k of kin) c[k.location] = (c[k.location] || 0) + 1; const best = Object.entries(c).sort((a, b) => b[1] - a[1])[0][0]; return [best, `like your other ${lc(plural(typeOf(l).kind, 2))}`]; }

/* ================= backup ================= */
const BK_COLLS = [['list', 'list'], ['kitchen', 'kitchen'], ['products', 'hprods'], ['receipts', 'receipts'], ['recipes', 'recipes']];
async function downloadBackup(photos) {
  const h = S.hh, pack = arr => arr.map(x => ({...x}));
  if (photos) { toast('Gathering receipt photos…'); for (const r of S.receipts || []) if (r.hasImg && !r.img) await receiptImg(r); }
  const data = {app: 'shelf-and-cart', version: VERSION, exportedAt: new Date().toISOString(), household: {name: h.name, places: h.places || [], zones: h.zones || null},
    list: pack(S.list), kitchen: pack(S.kitchen), hprods: pack(Object.values(S.products)), recipes: pack(S.recipes || []),
    receipts: pack(S.receipts || []).map(r => { const img = r.img || RIMG.get(r.id) || null; return photos ? {...r, img} : {...r, img: null}; })};
  const blob = new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'}), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `shelf-and-cart-${slug(h.name)}-${todayYmd()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast(`Backup saved (${Math.max(1, Math.round(blob.size / 1024))} KB)`);
}
async function restoreBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); if (data.app !== 'shelf-and-cart') throw 0; } catch (e) { toast('That isn’t a Shelf & Cart backup file.'); return; }
  const counts = BK_COLLS.map(([k, c]) => [c, (data[c === 'hprods' ? 'hprods' : k] || []).length]);
  sheet(`<h3>Restore backup?</h3><p class="hint">From <b>${esc(data.household?.name || 'a household')}</b>, saved ${esc(String(data.exportedAt || '').slice(0, 10))}. It goes into <b>${esc(S.hh.name)}</b>. Items with the same ID are replaced; nothing else is deleted.</p>
    <div class="note">${counts.map(([c, n]) => `${n} ${{list: 'on the list', kitchen: 'in stock', hprods: 'product notes', receipts: 'receipts', recipes: 'recipes'}[c]}`).join(' · ')}</div>
    <label class="checkline"><input type="checkbox" id="bkZones" ${data.household?.zones ? '' : 'disabled'}> Also restore sections and locations</label>
    <div class="actions"><button class="btn primary" id="bkGo">Restore</button><button class="btn" data-act="closeSheet">Cancel</button></div>`, el => {
    el.querySelector('#bkGo').onclick = async ev => {
      ev.target.disabled = true; ev.target.textContent = 'Restoring…';
      try {
        const ops = [];
        for (const [key, coll] of BK_COLLS) for (const d of (data[coll === 'hprods' ? 'hprods' : key] || [])) {
          if (!d || !d.id) continue;
          const {id, ...rest} = d;
          if (coll === 'receipts') {
            if (rest.img === '(photo not included)') rest.img = null;
            if (rest.img && rest.img.startsWith('data:')) { ops.push([doc(fs, 'households', S.hid, 'rphotos', String(id)), {img: rest.img}]); rest.hasImg = true; rest.thumb = rest.thumb || await tinyThumb(rest.img).catch(() => null); }
            else { const cur = (S.receipts || []).find(r => r.id === id); if (cur?.hasImg) { rest.hasImg = true; rest.thumb = rest.thumb || cur.thumb || null; } }
            rest.img = null;
          }
          ops.push([doc(fs, 'households', S.hid, coll, String(id)), rest]);
        }
        for (let i = 0; i < ops.length; i += 300) { const b = writeBatch(fs); ops.slice(i, i + 300).forEach(([r, d]) => b.set(r, d)); await b.commit(); }
        if (el.querySelector('#bkZones').checked) await updateDoc(doc(fs, 'households', S.hid), {zones: data.household.zones, places: data.household.places || []});
        closeSheet(); toast(`Restored ${ops.length} things.`);
      } catch (e) { ev.target.disabled = false; ev.target.textContent = 'Try again'; toast('Couldn’t finish (' + (e.code || e.message || 'error') + ').'); }
    };
  });
}

/* ================= spending ================= */
function spendRows() {
  // totals can be "84.50", "$84.50", "1,084.50" or missing (then the itemized lines plus tax count); dates can be missing (then the day it was saved)
  const amt = v => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
  const ymdOf = r => { const d = String(r.date || ''); if (/^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(0, 10); const t = new Date(d || r.at || Date.now()); return isNaN(t) ? todayYmd() : `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };
  const rs = (S.receipts || []).map(r => { const lines = round2((r.lines || []).reduce((a, x) => a + amt(x.price), 0) + amt(r.tax)), dish = round2((r.dishes || []).reduce((a, d) => a + amt(d.price) * (d.qty || 1), 0));
    const total = amt(r.total) || lines || dish; return {...r, total, date: ymdOf(r), _guess: !amt(r.total) && total > 0}; }).filter(r => r.total > 0);
  return rs;
}
function renderSpending() {
  const rs = spendRows();
  const skipped = (S.receipts || []).length - rs.length, guessed = rs.filter(r => r._guess).length;
  const months6 = new Date(new Date().getFullYear(), new Date().getMonth() - 5, 1).getTime();
  const offDate = rs.filter(r => dateAt(r.date) < months6 || dateAt(r.date) > Date.now() + 3 * 864e5);
  if (!rs.length && !(S.waste || []).length) return `<div class="empty"><b>No spending yet</b>Receipts with a total show up here by month, store and person.</div>`;
  const ym = d => d.slice(0, 7), now = new Date(), months = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`); }
  const sel = S.spendMonth && months.includes(S.spendMonth) ? S.spendMonth : months[5];
  const tot = m => round2(rs.filter(r => ym(r.date) === m).reduce((a, r) => a + Number(r.total), 0));
  const max = Math.max(1, ...months.map(tot));
  const inM = rs.filter(r => ym(r.date) === sel), total = tot(sel), shared = round2(inM.reduce((a, r) => a + Number(r.total) - Number(r.personal || 0), 0));
  const group = (arr, keyF, valF) => { const g = {}; for (const x of arr) { const k = keyF(x); g[k] = (g[k] || 0) + valF(x); } return Object.entries(g).sort((a, b) => b[1] - a[1]); };
  const bars = rows => `<div class="sbars">${rows.slice(0, 8).map(([k, v]) => `<div class="sbar"><span class="k">${esc(k)}</span><span class="track"><i style="width:${Math.max(3, v / rows[0][1] * 100)}%"></i></span><span class="v">${money(v)}</span></div>`).join('')}</div>`;
  const byStore = group(inM, r => r.store || 'No store', r => Number(r.total));
  const byPayer = group(inM, r => isMine(r.by) ? 'You' : who(r.by), r => Number(r.total));
  const lines = inM.filter(r => r.kind !== 'restaurant').flatMap(r => (r.lines || []).filter(x => Number(x.price) > 0));
  const byCat = group(lines, lineCat, x => Number(x.price));
  S._spendLines = inM.filter(r => r.kind !== 'restaurant');
  const dineM = round2(inM.filter(r => r.kind === 'restaurant').reduce((a, r) => a + Number(r.total), 0));
  const kinds = dineM ? [['Groceries and household', round2(total - dineM)], ['Eating out', dineM]].sort((a, b) => b[1] - a[1]) : [];
  const feesM = round2(inM.filter(r => r.kind === 'restaurant').reduce((a, r) => a + (Number(r.fees) || 0), 0)), delivN = inM.filter(r => r.kind === 'restaurant' && delivered(r)).length;
  const settled = (S.receipts || []).flatMap(r => Object.entries(r.paid || {}).map(([u, t]) => ({u, t, r}))).sort((a, b) => b.t - a.t).slice(0, 8);
  const label = m => new Date(+m.slice(0, 4), +m.slice(5) - 1, 1).toLocaleDateString(undefined, {month: 'short'});
  return `<div class="card" style="box-shadow:none">
      <div class="months">${months.map(m => `<button class="mbar ${m === sel ? 'on' : ''}" data-act="spendMonth" data-v="${m}"><span class="col"><i style="height:${Math.max(2, tot(m) / max * 100)}%"></i></span><span>${label(m)}</span></button>`).join('')}</div>
      <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span style="font:750 28px var(--f-display)">${money(total)}</span><span class="note">${new Date(+sel.slice(0, 4), +sel.slice(5) - 1, 1).toLocaleDateString(undefined, {month: 'long', year: 'numeric'})} · ${inM.length} receipt${inM.length === 1 ? '' : 's'}${shared !== total ? ` · ${money(total - shared)} personal` : ''}</span></div></div>
    ${offDate.length ? `<div class="estnote">${offDate.map(r => `<b>${esc(r.store || 'A receipt')}</b> is dated ${esc(fmtDate(r.date))}`).join(', ')}, outside these months, so it isn’t in the chart. If the date was misread, <button class="linkbtn" data-act="openRcpt" data-id="${offDate[0].id}">open it</button> and fix it.</div>` : ''}
    ${skipped || guessed ? `<div class="estnote">${skipped ? `${skipped} receipt${skipped === 1 ? ' has' : 's have'} no total yet, so ${skipped === 1 ? 'it isn’t' : 'they aren’t'} counted. ` : ''}${guessed ? `${guessed} without a total ${guessed === 1 ? 'is' : 'are'} counted from ${guessed === 1 ? 'its' : 'their'} itemized prices. ` : ''}<button class="linkbtn" data-act="rfilter" data-v="all">Open receipts</button></div>` : ''}
    ${budgetHtml(sel)}
    ${kinds.length ? `<div class="group"><h2>Groceries vs eating out</h2>${bars(kinds)}${feesM ? `<div class="note">🛵 ${delivN} deliver${delivN === 1 ? 'y' : 'ies'} this month · ${money(feesM)} in delivery and service fees</div>` : ''}</div>` : ''}
    ${inM.length ? `<div class="group"><h2>By store</h2>${bars(byStore)}</div><div class="group"><h2>Who paid</h2>${bars(byPayer)}</div>
    ${byCat.length ? `<div class="group"><h2>By category <span class="hint" style="text-transform:none;letter-spacing:0">· tap one to see the items</span></h2><div class="sbars">${byCat.slice(0, 14).map(([k, v]) => `<button class="sbar tap" data-act="spendCat" data-c="${esc(k)}"><span class="k">${esc(k)}</span><span class="track"><i style="width:${Math.max(3, v / byCat[0][1] * 100)}%"></i></span><span class="v">${money(v)}</span></button>`).join('')}</div>

/* ================= budget =================
   A monthly amount for groceries and household, and one for eating out (each optional), shared by the household.
   Spending shows how much is used and where the month is headed; the Today card speaks up at 80% or when the pace runs over. */
const BUDGETS = [['grocery', 'Groceries and household', '🛒'], ['dining', 'Eating out', '🍽']];
function budgetFor(ym) {
  const b = S.hh?.budget || {}, rs = spendRows().filter(r => r.date.slice(0, 7) === ym);
  const now = new Date(), cur = ym === todayYmd().slice(0, 7), dim = new Date(+ym.slice(0, 4), +ym.slice(5), 0).getDate(), day = cur ? now.getDate() : dim;
  return BUDGETS.filter(([k]) => Number(b[k]) > 0).map(([k, name, ic]) => {
    const spent = round2(rs.filter(r => (r.kind === 'restaurant') === (k === 'dining')).reduce((a, r) => a + Number(r.total), 0)), cap = Number(b[k]);
    const pace = cur && day >= 5 ? round2(spent / day * dim) : null;
    return {k, name, ic, spent, cap, pct: spent / cap, pace, left: dim - day, cur, over: spent > cap, warn: spent > cap || spent >= cap * .8 || (pace != null && pace > cap * 1.05)};
  });
}
function budgetHtml(ym) {

  if (!bs.length) return `<div class="group"><h2>Budget</h2><button class="btn small" data-act="budget">Set a monthly budget</button></div>`;
  return `<div class="group"><h2>Budget <button class="linkbtn" data-act="budget" style="text-transform:none;letter-spacing:0;font-weight:600">Change</button></h2>${bs.map(b => `<div class="budget ${b.over ? 'over' : b.warn ? 'warn' : ''}">
      <div class="bline"><b>${b.ic} ${esc(b.name)}</b><span>${money(b.spent)} of ${money(b.cap)}</span></div>
      <div class="btrack"><i style="width:${Math.min(100, b.pct * 100)}%"></i>${b.pace ? `<s style="left:${Math.min(100, b.pace / b.cap * 100)}%" title="On pace for ${money(b.pace)}"></s>` : ''}</div>
      <div class="note">${b.over ? `${money(b.spent - b.cap)} over` : `${money(b.cap - b.spent)} left`}${b.cur ? ` · ${b.left} day${b.left === 1 ? '' : 's'} to go${b.pace ? ` · on pace for ${money(b.pace)}` : ''}${!b.over && b.left > 0 ? ` · about ${money((b.cap - b.spent) / b.left * 7)} a week` : ''}` : ''}</div></div>`).join('')}</div>`;

/* ================= deals =================
   No store shares its prices for free, so these come from your own receipts and scans:
   a better price for the same kind of thing at another store, which store is cheaper for the whole list, and price jumps. */
const _cheap = {v: -1, m: new Map()};

}

    const same = best.up && mine.up && best.up.u === mine.up.u, a = same ? best.up.v : best.p, b = same ? mine.up.v : mine.p;
    if (b > 0 && a <= b * .9) out = {best, mine, pct: 1 - a / b, unit: same};

}

    'Tidy up saves as you go (no Save button to forget), lists items A to Z, keeps unsaved AI suggestions if the sheet closes by accident, and has an All names tab: every name in stock, on the list and on Quick add, with the label each Quick add tile uses and a search box.',
    'Tidy up items: ✨ Clean up with AI fixes names (no more ALL CAPS), splits out the brand and type, and picks the category for every item at once; you check the highlighted changes and save. Show all items to tidy anything.',
    'Tidy up → Missing info lists food in stock without a date, nutrition facts or ingredients, with one-tap fixes for all of them: estimate dates, look up barcodes on Open Food Facts, or fill typical nutrition for fresh food with AI.']],
  ['3.16', 'October 2026', ['Opens faster, especially with a lot in stock: the screen is drawn once instead of once for each kind of data, price comparisons are worked out once, and the barcode library and fonts no longer hold up the first screen.',
    'Admin → Storage shows how much of the free 1 GB is used, by household, and can shrink receipt photos older than 3 months or delete photos left over from deleted receipts.']],
  ['3.15', 'October 2026', ['Quick add → Your usual: press and hold a tile (or right-click) to rename it, give it a photo or emoji, or remove it from Quick add.', 'List items can have their own picture now (tap one on the list): take one, choose one, find one online or make an AI picture. It carries over to the same item in stock.', 'When App Check blocks AI, the message now says which setting is wrong instead of a general hint.',
    'Produce and other fresh food without a sticker gets an estimated expiration date when it goes into stock, from the USDA FoodKeeper times for that food and where you keep it (bananas on the counter, berries in the fridge, potatoes in the pantry). It shows “est.” and you can change it. Item → No date? Estimate it, or In stock → View → Estimate missing dates for what you already have. Foods it doesn’t know: ✨ Ask AI.']],
  ['3.14', 'October 2026', ['Scanning reads shiny and curved labels better: every frame is also tried with glare and shadows evened out, at a close-up, and with a second barcode reader. It warns you about glare, turns the exposure down when it can, has a 2× zoom button on phones that support it, and you can tap the picture to focus.',
    'No barcode after a few seconds? Tap ✨ Identify it with AI. The barcode readers keep going while the AI looks, and whichever answers first wins.',
    'Receipt photos get ✨ Clean up, like a document scanner: white paper, dark text, no shadows. It’s on by default in the crop screen; tap it to compare with the original.',
    'Linking a receipt line to something in stock is a search box now: type a few letters and pick from matches with photos, newest first.']],
  ['3.13', 'October 2026', ['Tapping − on the last jar or carton asks how much is left (¾, ½, ¼, almost out, or all gone) instead of removing it, and switches it to How full.', 'Our recipes are grouped by cuisine or type (Italian, Indian, Mexican, Latin, Dessert…) with folding groups and Collapse all; set it on the recipe, or the AI and the app figure it out.', 'Ratings: give recipes and restaurant visits 1–5 stars (each person rates on their own; rows show the household average). Recipes can sort by ★ Best rated, and eating out shows your favorite places.', 'Nutrition facts now show the ingredient list and allergens (from Open Food Facts, a photo of the ingredients, or typed), with anything your health filters care about highlighted.', 'App Check: AI features now prove they come from your app (invisible reCAPTCHA), which Google requires for Firebase AI Logic from November 2, 2026. One-time setup in SETUP.md.']],
  ['3.12', 'October 2026', ['Start shopping → + Not on the list puts things you grab on impulse straight in the cart: type with suggestions, say it, or tap a produce tile.',
    'In the store: Scan into cart now checks off generic list items too (“cheese” → the Great Value Cheddar you picked), and scanning straight into stock checks the item off the list so nothing is doubled. Receipts show what matched, what needs a price and what isn’t in stock, with filters and + Add to stock.',
    'Categories: Spices & Seasonings is built in (smoked paprika, cumin, adobo…), and you can add your own (Baby, Pets, Garden) in Household settings → Categories. Tidy up items offers to move seasonings out of Pantry.',
    'One Collapse all / Expand all button on In stock and the list that switches as you go.',
    'Liquids: milk, juice, oil, detergent and similar start out as How full. The check in We ate out has sales tax and delivery fees.']],
  ['3.11', 'October 2026', ['Cleaner screens: one ☰ Menu button (with a green dot when synced) holds everything in short grouped lists; Help is just help; View is a small dropdown with switches; In stock has one toolbar; Recipes has one + Add button.',
    'Search everywhere: names autocomplete on the list, the Scan box, after a barcode isn’t found, and In stock (which now also offers things you don’t have yet). Store products are searched on their own when there’s little to show, with “More”. 🎤 on every search box, 📷 find-by-photo in In stock.',
    'Recipe ideas: filters (quick, good for our health, use what’s expiring, comfort, vegetarian, one pan) and cuisines; the database checks everything in stock and ranks by how much you already have; “Show different ones” never repeats. Search any recipe by name.',
    'Meal plan: ✨ Suggest dinners for the open days, built around your health filters, with Swap and a peek at each recipe.',
    'Sales & deals: the AI searches Google for this week’s sales at your stores on things you buy (with sources), or reads a weekly ad you snap. Items on sale get a 🏷 on the list.',
    'The check in We ate out: food before tax, sales tax (7% by default, change it once and it’s remembered), delivery and service fees for delivery or Uber Eats, then 10, 15, 18, 20% or your own tip, on the food or on the total, per person when splitting. Spending shows what delivery fees cost each month.',
    'Recipes open with Ingredients and Steps tabs. Ingredients are grouped (meat and seafood, produce, dairy and eggs, sauces and liquids, spices, dry and pantry) and each group folds; Collapse all hides them.',
    'Pictures: 🎨 Make a picture (AI) or 🔎 Find a photo for recipes and items that don’t have one.',
    'Spending: tap a category to see each line, what it’s linked to, and fix its category (or let the AI sort “Other”). Tidy up items fixes nameless barcodes and things filed under Other; icons use brands (shampoo, medicine, skin care) and a letter instead of a brown box.']],
  ['3.10', 'October 2026', ['Nutrition facts for anything in stock: from Open Food Facts when you scan a barcode, from a photo of the label (the AI reads it), or typed in. Shown like the label, with % daily value, and the health filters use it.',
    '“I ate” ½, 1, 1½, 2 or 3 servings adds the label’s calories, protein, sodium and more to your food log. Picking a stock item in the food log uses the label too.',
    'Cooking instructions: snap the back of the frozen pizza box before you toss it. The photo is kept (even with AI off), the AI pulls out oven, air fryer and microwave directions, and you can add your own notes. “Cook it this way” opens cook mode with timers. Items with instructions show 🔥 How to cook.']],
  ['3.9', 'October 2026', ['Multi-packs: a carton of 12 or 18 eggs (or anything with “12 ct”, “6 pk” or “1.5 dozen” in the name) is one pack you count down one at a time: “9 of 12 eggs left”. Tap an item that’s still counted as packages to switch it, and 1 carton becomes 12 eggs.',
    'Running out: the app learns how fast you use things (every − tap), how long one lasts, and how often you buy it. The List shows “You’ll probably need” with one-tap add, and Menu → Running out shows everything.',
    'Produce codes: type the number on a produce sticker (4011, or 94011 for organic) on the Scan screen.',
    'Read the date: snap the best-by or sell-by stamp on a package and the AI fills in the date (a sell-by date goes through the food-safety estimate).',
    'Budget: a monthly amount for groceries and for eating out in Spending, with how much is left, the pace for the month, and a heads-up on the Today card.',
    'Deals from your own receipts: “Cheaper at Publix” on list items, which store is cheaper for the whole list, and prices that went up.',
    'Easier to use: a welcome tour the first time (Help → Show the welcome tour), Large and Extra large text, and Simple view with fewer details and bigger rows (Menu → This device).']],
  ['3.0 – 3.8', 'October 2026', ['3.8: Cook mode: big steps you cross off as you go (shared between phones), ingredient check-off, step timers that beep, and an AI plan that splits the work between cooks and overlaps tasks.', '3.7.2: Recipes keep prep, cook and a waiting step separately (marinate 30 min to overnight, rise 1–2 hrs); links and photos fill them in; the plan reminds you the night before a long marinade; all-caps titles are tidied.', '3.7.1: Type a name or a barcode on the Scan screen with suggestions as you type; Quick add has tabs and a catalog of about 200 everyday items; Spending counts receipts whose total or date was missing or oddly formatted.', '3.7: Eating out: snap a restaurant check and the AI lists the dishes with calories, protein, carbs, fat, fiber, sugar and sodium; rate dishes, keep notes, log what you ate, turn a dish into a recipe, and see eating out vs groceries in Spending. The food log now shows protein, carbs and more for the day.', '3.6.1: Receipt prices now link to the things you bought within a day of the receipt (by name, type and receipt shorthand, then AI for the rest), including receipts you already saved, so far more items show their price.', '3.6: Put away asks first: every item shows where it’s going (and why), tap to change it, and the app learns your choices; AI can place the guesses; shopping mode shows an estimated total; a reminder to snap the receipt after putting things away.', '3.5.1–3.5.2: Wide layout uses the whole screen (side rail, columns that fill HD to ultrawide monitors); layout and theme switches are in the Menu; many more produce pictures (plantains, scallions, celery, limes, peppers, berries and more).', '3.5: Recipes from a link (the AI reads the page; share a recipe page to the app on Android); items without a photo get a drawn thumbnail of the food (🥚 🥑 🧅 🌿) on their category’s color in In stock, the list, tiles and Fridge view.', '3.4: Food & water log (private to you): tap +1 cup as you drink, log meals with estimated or exact calories (AI estimates from words or a photo), take what you ate out of stock, and see your week with tips.', '3.3: New Menu (people button) with one-tap shortcuts to every feature; tap any health label to open its food guide; Food guide, Leftovers, Meal plan and Activity chips on In stock and Recipes; a single View button on In stock; Help topics now take you to the feature.', '3.2.3: AI reads are faster (low thinking, smaller photos), show a timer with Cancel, and give up after 45 seconds per model instead of spinning; the app caches recipe and brand checks so screens redraw faster.', '3.2.2: prices show on items in stock (tap an item for its price history); receipts and imported orders check that items add up to the total, flag lines that were hard to read, can ask the AI to find what’s missing, and link receipt lines to items in stock.', '3.2.1: clearer App Check message; cake and brownie mixes no longer count as chocolate.', '3.2: Quick expiration picks for 6 months and 1, 2 or 3 years; import Walmart and Amazon orders (paste, screenshots, PDF or share to the app); health filters for gout, cholesterol, blood pressure and sugar plus allergies, with nutrition from Open Food Facts and a food guide; leftovers with use-by dates; We made this (takes ingredients out of stock); weekly meal plan with Shop for the week; waste tracker; voice add; quick-add grid; aisle order per store; unit prices and price check across stores; recent activity.', '3.1: Fridge view: big photo shelves for tablets and phones, with quick actions, filters, photo sizes and keep-screen-on. Use a photo you already took (finds a barcode in it, or makes it a photo item) and an AI features on/off switch (Household → You).', '3.0.1–3.0.2: clearer AI error messages, a Test AI button (Household → This device), and a busy AI model falls back to the next one.', 'AI vision: snap a label or a no-barcode item and the AI fills in the name, brand, type, section, how to track it and a typical keep-by date.',
    'Crop and rotate every photo (items, receipts, recipes) before saving.',
    'Item types and brands: In stock shows the type first (Mozzarella, Salad, Sausage) with the brand underneath, and stacks items of the same type together (Salad · 4). “Sort with AI” sorts everything at once; tap an item to fix its type or brand. The list shows what you already have of that type, and “Keep at least” can count every brand together.',
    'Consumption tracking: count single units (eggs left out of 18) or how full a container is (milk or oil at 30%). Tap the bar to update it; the app learns how fast you use things and estimates when you’ll run out.',
    'Recipes tab: write, paste or snap your own recipes (the AI types them in). Each ingredient is checked against what’s in stock in every household you’re in, and what’s missing goes on the list in one tap. Share a recipe with another household.',
    'Ideas from what we have: AI recipe suggestions that use up what’s expiring, or browse the free TheMealDB recipe database.',
    'Today card on the List: what to use soon, what’s running low, what you can cook and who owes whom. In the app only, no notifications.',
    'Spending in Receipts: monthly totals, by store, who paid, by category, and settle-up history.',
    'Photo tiles view for In stock.',
    'Backup: download everything to a file and restore it later.',
    'Help and What’s new (this screen). Household moved to the people button at the top right.',
    'Cleanup: the version 1 data and code are gone now that everyone has moved into households. Updated to Firebase 12.']],
  ['2.5', '', ['Custom sections: add, rename, recolor, reorder and remove sections like Snack shelf or Garage freezer.', 'Collapse and expand sections, categories and list aisles, with Collapse all / Expand all.', 'Receipt prices: price each item bought that day to build price history.', 'Theme (light/dark) and layout (phone/desktop) per device.']],
  ['2.4', '', ['Date bought: Just bought or Already had when stocking up.', 'Sell-by dates turned into real use-by estimates from the FoodSafety.gov cold storage chart.', 'Receipts with photos, splits, personal amounts and Mark paid.', 'Scanner Done button goes straight back to scanning.']],
  ['2.3', '', ['Locations within a household (Davie and Plantation, Wellington and Jensen Beach).', 'The list is shared and tagged by location.']],
  ['2.2', '', ['The admin manages people from a list of everyone who has signed in.', 'No more automatic joining.', 'Trash for deleted households, with Restore.']],
  ['2.1', '', ['One person can be in several households and switch between them.', 'Admin tools to create and delete households.']],
  ['2.0', '', ['Households: share the app with family through an invite code. Each household has its own list and stock.']],
  ['1.x', '', ['Bathroom, Laundry and Cleaning sections.', 'Edit any item, change its photo, take photos with the camera.', 'Expiration dates and Expiring soon.', 'Search by name with close matches when a barcode isn’t found.', 'Low-stock alerts, stores, price notes and shopping mode.', 'Works offline and syncs when you’re back online.']],
  ['1.0', '', ['Shared grocery list and What we have (Fridge, Freezer, Pantry).', 'Live barcode scanning with Open Food Facts, Open Products Facts and Open Beauty Facts.', 'Photo items with your own description.', 'Installs to the home screen from GitHub Pages.']],
];
const HELP = [
  ['Expiration dates', 'Fresh food with no date gets an estimate as it goes into stock, based on the kind of food and where it’s kept; it shows <b>est.</b> On the card after adding or in the item, <b>Estimate…</b> lets you change the food type, where it’s kept or the day you bought it, and remembers your choice for next time. <b>Sell-by date…</b> turns a sell-by date into a real use-by, and <b>📷 Read the date</b> reads a printed date. In stock → <b>View</b> → <b>Estimate missing dates</b> fills in everything you already have.'],
  ['Scanning and adding', 'Shiny or curved label? Tilt it a little so the light isn’t shining straight back, tap the picture to focus, or try <b>2×</b>. No barcode at all? Tap <b>✨ Identify it with AI</b>; the barcode readers keep watching while it looks. Produce stickers: type the 4-digit number (4011 bananas; a 9 in front means organic). <b>📷 Read the date</b> on the card after adding (or when editing an item) reads the best-by or sell-by stamp from a photo. Type in the box on the Scan screen: names get suggestions as you type (your own items first, then a grocery catalog, then brands from Open Food Facts), and numbers look up a barcode. <b>Quick add</b> has tabs: your usual items, produce, dairy, meat, bakery, pantry, frozen, snacks, drinks and household. Tap the green scan button. Pick a mode: <b>Stock up</b> adds to a section, <b>Used it up</b> takes one out and adds it to the list, <b>Add to list</b> just adds it. Unknown barcode? Search by name, or <b>Snap the label</b> and the AI reads it. <b>No barcode</b> takes a photo; crop it and the AI suggests the name.'],
  ['In stock', 'Items are grouped by section, then by type: <b>Mozzarella</b> with the brand underneath, or <b>Salad · 4</b> with each kind inside. Tap a heading to fold it. <b>Full names</b> switches back to plain names; <b>Tiles</b> shows photos. Tap an item to edit its name, type, brand, dates, photo, section or location.'],
  ['Fridge view (tablets and phones)', 'In stock → <b>Fridge view</b> shows everything as big photos, one section at a time, with a shelf per category. Swipe along a shelf, tap food for big + / − buttons, how full it is, Add to list or Edit. <b>Use soon</b> and <b>Running low</b> filter it; S / M / L sets the photo size; the sun button keeps the screen on. For a tablet on the counter, add the app to its home screen, open it, and bookmark the page while Fridge view is open (it ends in <b>#fridge</b>) so it opens straight into it.'],
  ['Health filters', 'Menu (people button, top right) → <b>Health filters</b>, or tap any health label: turn on gout, high cholesterol, high blood pressure or avoiding sugar, and any allergies. Foods get a small label in stock, on the list, in recipes, in Fridge view and when you scan (♥ limit, ⚠ avoid). Labels use the nutrition facts from Open Food Facts when the barcode has them, otherwise the type of food. <b>Food guide</b> lists what to choose, limit and avoid, plus what’s in your kitchen now. It’s per person and isn’t medical advice.'],
  ['Online orders (Walmart, Amazon)', 'Scan screen → <b>Import a Walmart or Amazon order</b>. Paste the order confirmation email, or add screenshots or the PDF of the order page. Review the items, then everything goes into stock with the order date and prices, matching items come off the list, and it’s saved as a receipt you can split. On Android you can also share the email or a screenshot to Shelf & Cart. The stores don’t let other apps read your orders directly, so this is the way in.'],
  ['Leftovers, meal plan and waste', 'In stock → <b>+ Leftovers</b> saves cooked food with a use-by 4 days out (2 months in the freezer). On a recipe, <b>We made this</b> takes the ingredients out of stock and can save the leftovers, and <b>Plan it</b> puts it on a day. Recipes → <b>This week</b> shows the plan and <b>Shop for the week</b> adds everything missing. When something goes bad, tap it → Remove → <b>Threw it away</b>; Receipts → Spending shows what you waste most.'],
  ['Voice, quick add, aisles and prices', 'Tap the mic next to Add on the list and say “milk, eggs and two avocados”. The scan screen has a <b>Quick add</b> grid for produce and other things without barcodes. Pick a store on the list → <b>Arrange aisles</b> to sort the list the way you walk that store. Prices show the price per ounce or count, and an item’s page compares the same type of food across stores. Household → <b>Recent activity</b> shows who did what.'],
  ['Eating out', '<b>The check</b>: pick how you got it (dine in, pickup, delivery, Uber Eats, DoorDash…); delivery adds a <b>Delivery & service fees</b> line. Type the food and drinks before tax; sales tax is added at 7% (change the % once and it’s remembered, or type the exact tax from the receipt). Then tap 10, 15, 18 or 20% (or type your own) to tip on the food before tax, or switch to tipping on the total with tax. It fills in the tip and the total paid, and shows each person’s share when you split. Menu → <b>Ate out</b> (or Receipts, or the Food log). Snap the check: the AI lists each dish with its price and estimated calories, protein, carbs, fat, fiber, sugar and sodium, flags anything that clashes with your health filters, and you can rate dishes and keep notes (what was in it, order again?). Tick <b>I ate this</b> to add it to your food log, or tap <b>Make it at home</b> for a recipe inspired by it. It counts in Spending as eating out and can be split like any receipt. Receipts → <b>Eating out</b> lists every visit, favorites and notes.'],
  ['Food and water log', 'Menu → <b>Food & water</b>, or the water line on the Today card. Tap <b>+1 cup</b> as you drink. Type what you ate (“2 eggs and toast”) and the app estimates the calories from typical portions, or type the exact number. With AI on, <b>Estimate with AI</b> or a <b>photo of the meal</b> works for anything. Picking something from stock can take it out of stock too. <b>This week</b> shows calories and water by day and a few tips. Your log is private to you.'],
  ['Finding things', 'Every search box autocompletes as you type: your own items first, then the grocery catalog and produce codes, then store products online (they load on their own when there’s little to show; tap <b>More</b> for more). Tap 🎤 to say it. In stock, the search shows what you have and, below it, things to add to the list or stock; 📷 finds an item from a photo.'],
  ['Reading a recipe', 'Open a recipe: <b>Start cooking</b> is at the top, then <b>Ingredients</b> and <b>Steps</b> tabs (the app remembers which you used last). Ingredients are grouped like a kitchen: meat and seafood, produce, dairy and eggs, sauces and liquids, spices, dry and pantry. Tap a group to fold it, or <b>Collapse all</b>. No picture? <b>Make a picture</b> asks the AI to draw it (some Google plans don’t include this), <b>Find a photo</b> looks for a real one. Items have the same two buttons when you edit them.'],
  ['Recipe ideas, meal plan and deals', 'Recipes → <b>Ideas from what we have</b>: pick a mood and a cuisine, then <b>Suggest with AI</b> or <b>From the recipe database</b>; <b>Show different ones</b> brings new ones each time. Type any dish in the search box to find recipes for it. <b>This week</b> → <b>Suggest dinners</b> fills the open days to fit your health filters; Swap any you don’t like. Menu → <b>Sales & deals</b> finds this week’s sales at your stores on what you buy, or reads a weekly ad photo.'],
  ['Categories', 'Menu → Household settings → <b>Categories</b>. The built-in ones include <b>Spices & Seasonings</b>; add your own with an emoji and where they’re usually kept. Removing one moves its items to Other. To move one item, tap it and pick a category; Tidy up items finds seasonings that are still filed under Pantry.'],
  ['Spending details and tidying up', 'Spending → tap a category (like Other) to see every receipt line in it, the item it’s linked to, and change its category. <b>Sort with AI</b> files the Other lines. Menu → <b>Tidy up items</b> lists barcodes with no name and things in Other: rename, pick a category, look them up again, or hide them from Quick add.'],
  ['Nutrition facts and cooking instructions', 'Tap an item (or use the buttons on the card right after you scan it) → <b>🥗 Nutrition facts</b>: <b>Read the label</b> (photo, AI), <b>Look it up online</b> (barcode items) or <b>Type it in</b>. Pick how many servings you ate and add them to your food log. <b>🔥 Cooking instructions</b>: snap the instructions on the box, or <b>Write notes</b> like “air fryer 380°F, 12 min, flip halfway”. Each method gets <b>Cook it this way</b>, which opens cook mode with timers. Both are saved with the product, so the next box you buy already has them, and everyone in the household sees them.'],
  ['Eggs and other multi-packs', 'A carton of eggs is <b>one pack of 12 (or 18) eggs</b>, not 12 packages. Anything with a count in the name (“18 ct”, “1.5 dozen”, “6 pk”) is counted one at a time automatically: scanning a carton adds 12, and <b>−</b> takes away one egg. The row says “9 of 12 eggs left”. For something already in stock as packages, tap it → <b>Count each egg instead</b>; your 1 carton becomes 12. Use <b>Packages</b> for things you finish one whole package at a time (a jar of salsa, a bag of chips), <b>Counting each one</b> for packs you use piece by piece (eggs, yogurt cups, cans of soda), and <b>How full</b> for liquids and anything you pour or use a bit at a time (milk, juice, oil, detergent, shampoo).'],
  ['Running out, budget and deals', '<b>Running out</b>: each − tap, each time you finish one, and each purchase teach the app how fast you go through things. The List shows <b>You’ll probably need</b>; tap one to add it, or Menu → <b>Running out</b> for the full picture. <b>Budget</b>: Spending → <b>Set a monthly budget</b> for groceries and for eating out. The bar shows what’s used and a mark for where the month is headed; the Today card warns at 80% or when the pace runs over. <b>Deals</b> come from your own receipts (stores don’t share prices for free): list items say when another store had it cheaper, the List says which store is cheaper for everything on it, and price jumps are flagged with ↑.'],
  ['Bigger text and Simple view', 'Menu → <b>This device</b>: <b>Large</b> or <b>Extra large</b> text, and <b>Simple view</b>, which hides prices, brands and barcodes and makes rows bigger. Both only change this phone. Help → <b>Show the welcome tour</b> plays the tour again.'],
  ['Tracking how much is left', 'Tap an item → <b>Track it by</b>: <b>Packages</b> (default), <b>Counting each one</b> (set the pack size, e.g. 18 eggs; each scan adds 18, − takes one egg) or <b>How full</b> (milk, juice, oil, detergent: tap the bar and slide to 30%). <b>Finished this one</b> opens the next container. After a few weeks the app shows how fast you use it and when it’ll run out.'],
  ['The list and shopping', 'Best way at the store: make the list at home, then in the store tap <b>Start shopping → Scan into cart</b> and scan each thing as it goes in the cart. Each scan checks off the matching list item, even a generic one (“cheese” becomes the Great Value Cheddar you picked); things that weren’t on the list are added to the cart. At checkout, snap the receipt: prices land on the cart items. At home, <b>Put away</b> moves everything into stock with its place. If you scan straight into stock instead, the matching list item is checked off for you. In the store, tap items to check them off in <b>Start shopping</b> (it shows about what the cart will cost). At checkout, snap the receipt. At home, <b>Put away</b> shows where each item will go: tap a section to fix one, and it remembers next time. Add items by typing, the cart button on any item, or Used it up scans. Each item shows what you already have, including other items of the same type. <b>Keep at least</b> adds things automatically when they run low. <b>Start shopping</b> opens big buttons and scan-to-cart; <b>Put away</b> moves everything into stock.'],
  ['Cooking', 'Open a recipe → <b>Start cooking</b>. The screen stays on, steps are big, and tapping a step crosses it out (the next one is highlighted). Steps with a time get a ⏱ timer that beeps and vibrates when it’s done. Tick ingredients off as you take them out. <b>Plan it for us</b>: pick who’s cooking and the AI splits the work (Rafael on the stove, Raquel prepping) and overlaps it, like starting the pasta water while the shrimp cooks. On a saved recipe everyone’s phone shows the same progress.'],
  ['Recipes', 'Write, paste or snap a recipe, or tap <b>From a link</b> and paste a recipe page’s address: the AI opens the page and types it in (on Android you can also share a recipe page to Shelf & Cart). Open one to see each ingredient checked against your stock (and your other households’ stock), tick what to buy and add it to the list. <b>Ideas from what we have</b> suggests recipes that use up what’s expiring.'],
  ['Receipts and splitting', 'Snap a receipt; the AI reads the store, date, total and prices. Pick who you’re splitting with and tap <b>Mine</b> for personal items. <b>Mark paid</b> when they pay you back. <b>Spending</b> shows totals by month, store and person.'],
  ['Households and locations', 'The people button at the top right opens the <b>Menu</b> (it also has <b>This device</b>: Phone or Wide layout and light or dark theme): shortcuts to every feature, switching households, health filters and the AI switch. <b>Household settings</b> there has switch households, invite people, manage sections and locations, theme, layout and backup. The admin also gets <b>Admin: people and households</b>.'],

/* ================= thrown away ================= */
async function tossOne(k, all = false) {
  const t = trackOf(k), cost = priceInfo(k)?.last.p || null;
  const share = t === 'level' ? (k.level ?? 100) / 100 : t === 'count' ? 1 / Math.max(1, k.packSize || 1) : 1;
  const n = all ? (t === 'count' ? (k.qty || 0) : (k.qty || 1)) : 1;
  const qty = Math.max(0, (k.qty || 0) - n), prev = strip(k);
  if (qty === 0 && !k.min && (t === 'pkg' || k.leftover)) await del('kitchen', k.id).catch(() => {});
  else await put('kitchen', k.id, {...prev, qty, ...(t === 'level' ? {level: qty ? 100 : 0} : {})}).catch(() => {});
  const month = todayYmd().slice(0, 7), ty = typeOf(k);
  await setDoc(href('waste', month), {items: arrayUnion({t: Date.now(), by: S.uid, name: k.name, kind: ty.kind, cat: k.category || 'Other', n, cost: cost ? round2(cost * share * n) : null, expired: !!(k.exp && daysUntil(k.exp) < 0)})}, {merge: true}).catch(() => {});
  logAct(`threw out ${k.name}`);
  toast(`Logged ${k.name} as thrown away`, 'Undo', () => restore([{coll: 'kitchen', id: k.id, prev}]));
}
function wasteHtml(month) {
  const items = (S.waste || []).find(w => w.id === month)?.items || [];
  if (!items.length) return `<div class="group"><h2>Thrown away</h2><div class="sbars"><span class="note">Nothing logged this month. When something goes bad, tap it → <b>Threw it away</b> to see what you waste most.</span></div></div>`;
  const cost = round2(items.reduce((a, x) => a + (x.cost || 0), 0)), by = {};
  for (const x of items) by[x.kind || x.name] = (by[x.kind || x.name] || 0) + 1;
  const top = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 5);
  return `<div class="group"><h2>Thrown away · ${items.length}${cost ? ` · about ${money(cost)}` : ''}</h2><div class="sbars">${top.map(([k, n]) => `<div class="sbar"><span class="k">${esc(k)}</span><span class="track"><i style="width:${n / top[0][1] * 100}%;background:var(--danger)"></i></span><span class="v">${n}×</span></div>`).join('')}
    <span class="note">${items.filter(x => x.expired).length} of ${items.length} were past their date. Most wasted: <b>${esc(top[0][0])}</b>. Buy a smaller size, or freeze it sooner.</span></div></div>`;
}

    return {i, k: m, t, take};

function weekNeeds(recipes) {
  const pool = visK(), seen = new Map();
  for (const r of recipes) for (const i of r.ingredients || []) {
    if (isStaple(i) || stockMatches(i, pool).length) continue;
    const key = ingKey(i); if (!key || seen.has(key)) { if (seen.has(key)) seen.get(key).for.add(r.title); continue; }
    if (S.list.some(l => !l.done && (lc(l.name) === key || sameType(l, {name: key})))) continue;
    seen.set(key, {name: key, for: new Set([r.title])});
  }
  return [...seen.values()];
}
