const ORDER_STORES = ['Walmart', 'Amazon', 'Publix', 'Target', 'Costco', 'Instacart'];
function parseOrderText(text) {
  const items = [], skip = /subtotal|^total|order total|grand total|tax|tip|fee|savings|discount|delivery|shipping|order #|order number|payment|visa|mastercard|card ending|refund|substitut|unavailable|out of stock|thanks|track|balance|bag|pickup/i;
  for (let line of String(text).split(/\r?\n/)) {
    line = line.replace(/\s+/g, ' ').trim(); if (line.length < 4 || skip.test(line)) continue;
    const pm = line.match(/\$\s?(\d{1,4}(?:[.,]\d{2}))(?!.*\$\s?\d)/); if (!pm) continue;
    const price = +pm[1].replace(',', '.');
    let qty = 1; const qm = line.match(/\b(?:qty|quantity)[:\s]*(\d{1,3})\b/i) || line.match(/\b(\d{1,2})\s*[x×]\s/i); if (qm) qty = +qm[1];
    const name = line.replace(/\$\s?\d[\d.,]*/g, '').replace(/\b(?:qty|quantity)[:\s]*\d+\b/ig, '').replace(/\b\d{1,2}\s*[x×]\s/i, '').replace(/[|•·]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
    if (name.length > 2 && /[a-z]/i.test(name)) items.push({name: name.slice(0, 90), qty, price});
  }
  return {items};
}

${text ? 'Order text:\n' + text.slice(0, 15000) : ''}
Return only JSON: {"store": string or null, "date": "YYYY-MM-DD" or null, "total": final amount charged or null, "tax": tax plus delivery, bag and service fees minus any order-level discounts, as one number or null, "items": [{"name": product name with brand and size, "qty": number, "price": total price for that line, "category": one of ${JSON.stringify(CATS.filter(c => c !== 'Leftovers'))}, "kind": generic type in 1-3 words (e.g. "Mozzarella", "Paper towels")}]}`, files, 'order');

}

}

  if (age == null || trackOf(k) !== 'pkg' || (k.qty || 0) > 1) return null;
  const life = (pr?.life || []).length ? med(pr.life) : null;

  const every = buyEvery(pr); if (every) return {days: every - age, how: 'buys', every};

}

}

    seen.add(pkey(k)); out.push({it: k, days: p.days, why: p.how === 'use' ? 'At the rate you use it' : p.how === 'life' ? `One usually lasts ${Math.round(p.life)} days` : `Bought about every ${Math.round(p.every)} days`, stock: true});
  }

function popover(anchor, html, onMount) {

  document.body.append(scrim, el);

  let left = r.left / z, top = r.bottom / z + 6;
  if (left + w > W - 12) left = Math.max(12, r.right / z - w);
  if (top + h > H - 12) top = Math.max(12, r.top / z - h - 6);
  el.style.left = left + 'px'; el.style.top = top + 'px';
  addEventListener('keydown', popKey); onMount?.(el);
  el.addEventListener('click', e => { if (e.target.closest('[data-act]')) setTimeout(closePop, 0); });
  el.addEventListener('change', () => setTimeout(closePop, 0));
  el.querySelector('button')?.focus({preventScroll: true});
}

function stockSearch(q, date) {
  const t = [...new Set([...rtokens(q), ...tokens(q)])].filter(w => w.length > 1 && !/^\d+(oz|ct|lb|g|ml|pk)?$/.test(w));
  const out = [];
  for (const k of S.kitchen) {
    if (k.leftover) continue;
    const kt = [...rtokens(k.name), ...tokens(typeOf(k).kind), ...tokens(typeOf(k).brand || '')];
    const hit = t.length ? t.filter(w => kt.some(v => v.startsWith(w) || (w.length > 3 && w.startsWith(v)))).length : 0;
    if (t.length && !hit) continue;
    const near = date && k.bought ? Math.max(0, 3 - Math.abs(daysUntil(k.bought) - daysUntil(date))) : 0;
    out.push({k, sc: (t.length ? hit / t.length * 10 : 0) + near * 1.5 + (k.bought === date ? 2 : 0)});

function stockGuess(name, date) {
  const t = rtokens(name); if (!t.length) return null;
  let best = null, bestScore = 0;
  for (const k of S.kitchen) {
    const kt = rtokens(k.name); if (!kt.length) continue;
    const hit = t.filter(w => kt.some(v => v.startsWith(w) || w.startsWith(v))).length;
    let score = hit / Math.max(t.length, kt.length) + (sameType(k, {name}) ? .35 : 0) + (k.bought && date && k.bought === date ? .15 : 0);

function cropPhoto(file, {square = false, title = 'Crop the photo', doc = false} = {}) {
  return new Promise(async resolve => {
    let orig, enh = null, docOn = doc && (() => { try { return localStorage.getItem('ui:docscan') !== '0'; } catch (e) { return true; } })();
    try { orig = drawScaled(await loadImage(file), 2400); } catch (e) { toast('Couldn’t open that photo.'); resolve(null); return; }
    const cur = () => docOn ? (enh || (enh = docScan(orig))) : orig;
    let src = cur();
    const ov = document.createElement('div'); ov.className = 'cropper';
    ov.innerHTML = `<div class="ttl">${esc(title)}</div><div class="stage"><div class="box"><img alt=""><div class="rect"><span class="h nw"></span><span class="h ne"></span><span class="h sw"></span><span class="h se"></span></div></div></div>
      <div class="bar"><button class="btn" data-c="cancel">Cancel</button>${doc ? `<button class="btn" data-c="enh" aria-pressed="${docOn}" title="Even out shadows and glare and darken the text">✨ Clean up</button>` : ''}<button class="btn" data-c="rot">Rotate</button><button class="btn" data-c="full">Whole photo</button><button class="btn primary" data-c="ok">Use photo</button></div>`;
    document.body.appendChild(ov);
    const img = ov.querySelector('img'), rect = ov.querySelector('.rect');
    let R = null;
    const W = () => img.clientWidth, H = () => img.clientHeight;
    const reset = (full = false) => {
      const w = W(), h = H();
      if (full) R = {x: 0, y: 0, w, h};
      else if (square) { const s = Math.min(w, h) * .82; R = {x: (w - s) / 2, y: (h - s) / 2, w: s, h: s}; }
      else R = {x: w * .05, y: h * .05, w: w * .9, h: h * .9};
      draw();
    };
    const draw = () => { Object.assign(rect.style, {left: R.x + 'px', top: R.y + 'px', width: R.w + 'px', height: R.h + 'px'}); };
    const show = (keepRect = false) => { img.onload = () => keepRect && R ? draw() : reset(); img.src = src.toDataURL('image/jpeg', .9); };
    show();
    let drag = null;
    rect.addEventListener('pointerdown', e => { e.preventDefault(); rect.setPointerCapture(e.pointerId); const h = e.target.classList.contains('h') ? [...e.target.classList].find(c => c.length === 2) : 'move'; drag = {h, x: e.clientX, y: e.clientY, R: {...R}}; });

      const dx = e.clientX - drag.x, dy = e.clientY - drag.y, o = drag.R, w = W(), h = H(), min = 40;

      else {
        if (drag.h.includes('w')) { x = Math.min(Math.max(0, o.x + dx), o.x + o.w - min); rw = o.w + (o.x - x); }
        if (drag.h.includes('e')) { rw = Math.min(Math.max(min, o.w + dx), w - o.x); }
        if (drag.h.includes('n')) { y = Math.min(Math.max(0, o.y + dy), o.y + o.h - min); rh = o.h + (o.y - y); }
        if (drag.h.includes('s')) { rh = Math.min(Math.max(min, o.h + dy), h - o.y); }
        if (square) { const s = Math.min(rw, rh); if (drag.h.includes('w')) x = o.x + o.w - s; if (drag.h.includes('n')) y = o.y + o.h - s; rw = rh = s; }

      R = {x, y, w: rw, h: rh}; draw();

    ov.querySelector('.bar').onclick = e => {
      const c = e.target.closest('[data-c]')?.dataset.c; if (!c) return;
      if (c === 'cancel') return done(null);
      if (c === 'full') return reset(true);

    };
  });
}
